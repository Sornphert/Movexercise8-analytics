name: Refresh data

# Automatically pulls fresh Zoom / Meta / purchases data, commits the updated CSVs,
# and pushes — which triggers a Streamlit Community Cloud redeploy with the new data.
# Replaces the manual "run script locally → commit → push" chore.

on:
  schedule:
    # Daily at 22:00 UTC (= 06:00 Malaysia time). Adjust as you like — cron is in UTC.
    - cron: "0 22 * * *"
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

# Allow the job to commit + push back to the repo.
permissions:
  contents: write

# Never let two refreshes run at once (avoids push races).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Zoom data
        id: zoom
        continue-on-error: true
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_HOST_EMAIL: ${{ secrets.ZOOM_HOST_EMAIL || 'daphniek2021@gmail.com' }}
        run: python scripts/fetch_zoom_data.py --days 14

      - name: Fetch Meta ads
        id: meta
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: python scripts/fetch_meta_ads.py --days 30 --creatives

      - name: Refresh purchases cache
        id: purchases
        continue-on-error: true
        env:
          PURCHASES_SHEET_URL: ${{ secrets.PURCHASES_SHEET_URL }}
        run: python scripts/fetch_purchases_data.py

      - name: Commit & push updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: automated data refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed data."
          else
            echo "No data changes — nothing to commit."
          fi

      - name: Fail the run if any fetch failed
        if: always()
        run: |
          fail=0
          [ "${{ steps.zoom.outcome }}" = "failure" ]      && { echo "::error::Zoom fetch failed";      fail=1; }
          [ "${{ steps.meta.outcome }}" = "failure" ]      && { echo "::error::Meta fetch failed";      fail=1; }
          [ "${{ steps.purchases.outcome }}" = "failure" ] && { echo "::error::Purchases fetch failed"; fail=1; }
          exit $fail
